name: Firestore rules and sync

on:
  pull_request:
    paths:
      - .github/workflows/firestore.yml
      - firebase.json
      - firestore.rules
      - firestore.test.js
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/firestore.yml
      - firebase.json
      - firestore.rules
      - firestore.test.js
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore:
    name: Firestore Emulator — rules and two clients
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm exec --yes --package=firebase-tools@14.24.2 -- npm run test:rules -- --project demo-no-project

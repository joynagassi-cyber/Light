name: Light Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: bash ci/setup-android-sdk.sh
      - name: Compile APKs and run JVM tests
        shell: bash
        run: |
          if ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --console=plain 2>&1 | tee "$RUNNER_TEMP/light-gradle.log"; then
            exit 0
          fi
          # Keep compiler diagnostics and test failures visible even when the CI log archive is unavailable.
          awk '/^e: .*\.kt:/ || /FAILED/ || /AssertionFailedError/ || /expected:/ || /but was:/ || /^> Could not / || /org.junit/ { printf "::error::%s\n", substr($0, 1, 600); if (++n >= 40) exit }' "$RUNNER_TEMP/light-gradle.log"
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do [ -f "$f" ] || continue; if grep -q 'failures="[^0]\|errors="[^0]' "$f"; then echo "::error::FAILFILE $f"; grep -a "failure\|error" "$f" | head -20 | while IFS= read -r line; do echo "::error::$line" | cut -c1-900; done; cat "$f" | tr '\n' ' ' | grep -o "message=[^>]*" | head -10 | while IFS= read -r line; do echo "::error::$line" | cut -c1-900; done; fi; done
          exit 1
      - name: Post failure details to PR (for arena debugging)
        if: failure()
        shell: bash
        run: |
          echo "Collecting failure details..."
          {
            echo "### Test failures for ${{ github.sha }}"
            echo '```'
            for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do [ -f "$f" ] || continue; if grep -q 'failures="[^0]\|errors="[^0]' "$f"; then echo "=== $f ==="; cat "$f" | tr '\n' '\n' | head -200; echo "---END $f---"; fi; done
            echo '```'
            echo "Gradle log tail:"
            echo '```'
            tail -200 "$RUNNER_TEMP/light-gradle.log" | head -100
            echo '```'
          } > /tmp/failure.md
          cat /tmp/failure.md
          # Commit failure report to branch so arena can fetch via API
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            git config user.email "ci@light.local"
            git config user.name "Light CI"
            cp /tmp/failure.md ci-failure.md
            git add ci-failure.md
            git commit -m "ci: failure report ${{ github.sha }}" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          retention-days: 14
      - name: Verify debug APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'
      - name: Upload debug APK (local mode)
        uses: actions/upload-artifact@v6
        with:
          name: light-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

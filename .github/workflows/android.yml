name: Light CI/CD & Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 🚀 Build APK & Tests
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: ☕ Configuration de Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🔑 Droits d'exécution sur gradlew
      run: chmod +x gradlew

    - name: 🌐 Injection des Secrets (.env, google-services.json, Keystore)
      run: |
        # Configuration .env
        if [ ! -f .env ]; then
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi
        fi

        # Injection google-services.json
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          mkdir -p app
          if echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | grep -q '^{'; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          fi
        fi

        # Décodage du Keystore
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
        fi

    - name: 🔨 Compilation de l'APK (Debug & Release) & Tests
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PATH: my-upload-key.jks
      run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace

    - name: 📤 Téléversement des APKs générés (Artifacts)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: light-apks
        path: app/build/outputs/apk/**/*.apk
        retention-days: 14

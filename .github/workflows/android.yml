name: Light Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: bash ci/setup-android-sdk.sh
      - name: Compile APKs and run JVM tests
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --console=plain
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          retention-days: 14
      - name: Verify debug APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'
      - name: Upload debug APK (local mode)
        uses: actions/upload-artifact@v6
        with:
          name: light-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

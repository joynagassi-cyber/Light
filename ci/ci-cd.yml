name: Light CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Forcer le build de l APK Release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Validation de non-régression & Tests
  # =========================================================================
  test-and-validate:
    name: 🧪 Tests & Validation Non-Régression
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances pour tests de règles Firestore
        run: |
          npm ci || npm install

      - name: 🔥 Exécution des tests de sécurité Firestore (Firebase Emulator)
        run: |
          npx --yes firebase-tools emulators:exec --only firestore "node --test firestore.test.js"

      - name: ⚙️ Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Droits d'exécution sur gradlew
        run: chmod +x gradlew

      - name: 📄 Préparation des fichiers d'environnement (.env & mock google-services.json)
        run: |
          # Fichier .env
          if [ ! -f .env ]; then
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "${{ secrets.ENV_FILE }}" > .env
            else
              cp .env.example .env
            fi
          fi
          # google-services.json factice si non présent pour autoriser la compilation
          if [ ! -f app/google-services.json ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              if echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | grep -q '^{'; then
                echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
              else
                echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
              fi
            else
              mkdir -p app
              echo '{"project_info":{"project_number":"123456789","project_id":"demo-no-project","storage_bucket":"demo-no-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.elanstudy.vkmrxz"}},"oauth_client":[{"client_id":"dummy-web-client-id.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"dummy-api-key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
            fi
          fi

      - name: 🔍 Analyse statique Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: 🧪 Exécution des tests unitaires Android (Robolectric & JUnit)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 📊 Sauvegarde des rapports de tests et lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # =========================================================================
  # 2. Build & Signature APK Release
  # =========================================================================
  build-release-apk:
    name: 🚀 Build APK & Bundle Release
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Droits d'exécution sur gradlew
        run: chmod +x gradlew

      - name: 🌐 Configuration du fichier google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > app/google-services.json
            fi
            echo "✅ google-services.json injecté depuis les GitHub Secrets."
          else
            echo "⚠️ Secret GOOGLE_SERVICES_JSON absent. Utilisation d'un fichier fallback."
            echo '{"project_info":{"project_number":"123456789","project_id":"demo-no-project","storage_bucket":"demo-no-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.elanstudy.vkmrxz"}},"oauth_client":[{"client_id":"dummy-web-client-id.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"dummy-api-key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: 🔐 Configuration de la clé Keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "✅ Keystore my-upload-key.jks restauré depuis GitHub Secrets."
          else
            echo "⚠️ Secret KEYSTORE_BASE64 non trouvé. Génération d'une clé de signature release temporaire."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=Light, OU=Mobile, O=ElanStudy, L=Paris, C=FR"
          fi

      - name: 📝 Configuration des variables d'environnement (.env)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            echo "$ENV_FILE_CONTENT" > .env
            echo "✅ Fichier .env injecté depuis GitHub Secrets."
          else
            cp .env.example .env
            echo "ℹ️ Fichier .env initialisé depuis .env.example."
          fi

      - name: 🔨 Compilation de l'APK Release et de l'App Bundle (AAB)
        env:
          RAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          export STORE_PASSWORD="${RAW_STORE_PASSWORD:-android}"
          export KEY_PASSWORD="${RAW_KEY_PASSWORD:-android}"
          export KEY_ALIAS="${RAW_KEY_ALIAS:-upload}"
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 📦 Préparation des fichiers d'artefacts
        run: |
          mkdir -p release-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-output/Light-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-output/Light-release-unsigned.apk
          fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release-output/Light-release.aab
          fi

      - name: 📱 Téléversement de l'APK Release (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Light-release-apk
          path: release-output/*.apk
          retention-days: 30

      - name: 📦 Téléversement du Google Play Bundle (AAB Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Light-release-aab
          path: release-output/*.aab
          retention-days: 30

      - name: 🏷️ Publication automatique sur GitHub Release (Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/*.apk
            release-output/*.aab
          generate_release_notes: true
